<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static', filename='style.css') }}">
    <meta charset="UTF-8">
    <title>Rewind</title>
</head>

<body>
    <nav>
        <a href="{{ url_for('home') }}" class="home-logo">Rewind</a>
        <a href="{{ url_for('get_tracks') }}">Top Tracks</a>
        <a href="{{ url_for('get_artists') }}">Top Artists</a>
        <a href="{{ url_for('get_recently_played') }}">Recently Played</a>
        <details class="manage">
            <summary>Manage</summary>
            <div class="manage-menu">
                <a href="{{ url_for('logout') }}">Log out</a>
            </div>
        </details>
    </nav>

    {% block content %}{% endblock %}

    <script>
        // close the Manage dropdown when clicking anywhere outside it
        document.addEventListener("click", function (event) {
            const menu = document.querySelector("details.manage");
            if (menu && menu.open && !menu.contains(event.target)) {
                menu.open = false;
            }
        });
    </script>
</body>

</html>
